[project]
name = "raig"
version = "0.1.0"
description = "End-to-end auto-rigging for 2D vtuber avatars"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "psd-tools>=1.9.30",
    "mediapipe>=0.10.14",
    "moderngl>=5.10",
    "moderngl-window>=2.4.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
    "pytoshop>=1.2.1",
]

[project.scripts]
raig = "raig.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs webcam and/or downloaded MediaPipe models",
    "perf: timing-sensitive performance checks",
]
addopts = "-m 'not integration'"
